[project]
name = "heimdall"
version = "0.1.0"
description = "heimdall: terminal output, command runners, and subcommand interfaces for command line tools"
readme = "README.md"
authors = [{ name = "Neco Kriel", email = "necokriel@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "rich>=13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
sources = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["utests"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.basedpyright]
include = ["src", "utests"]
extraPaths = ["src", "."]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
reportMissingImports = true
reportMissingTypeStubs = false
reportUnusedParameter = "none"
reportImplicitStringConcatenation = "none"
reportUnusedCallResult = "none"
reportImplicitOverride = "none"
reportExplicitAny = "none"
reportAny = "none"
reportPrivateUsage = "none"
