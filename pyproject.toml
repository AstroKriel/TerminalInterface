[project]
name = "huginn"
version = "0.1.0"
description = "huginn: terminal output, command runners, and subcommand interfaces for command line tools"
readme = "README.md"
authors = [{ name = "Neco Kriel", email = "necokriel@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "rich>=13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
sources = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["utests"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.basedpyright]
include = ["src", "utests"]
extraPaths = ["src", "."]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"

## --- rules to enforce
reportMissingImports = true

## --- rules to suppress
reportExplicitAny = "none"  # argparse kwargs are genuinely heterogeneous
reportAny = "none"  # cascade from argparse kwargs and `Namespace` attributes
reportImplicitOverride = "none"  # `typing.override` needs Python 3.12; huginn supports 3.11
reportUnusedCallResult = "none"  # `subprocess.run`, `add_argument`, and `unittest.main` are called for their side effects
reportUnusedParameter = "none"  # command functions take `run_params` by contract even when they do not use it
reportUninitializedInstanceVariable = "none"  # false positive: test attributes are set in `setUp`
reportPrivateUsage = "none"  # tests check private helpers directly, e.g. how a legend label is built
